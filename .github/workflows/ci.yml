name: M0 repo consistency

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  repo-consistency:
    name: Repo-consistency suite (TP-CAT-00)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev requirements
        run: python -m pip install -r requirements-dev.txt

      - name: Repo-consistency test suite
        run: python -m pytest tests/ -q

      - name: Byte-compile scripts
        run: python -m compileall scripts -q
