  - {id: FP-CMD-027, name: "Command-line variants", desc: "Dashed variants (e.g. -LAYER) run dialog commands as prompts", p: P1, dep: [], status: planned, test: "", note: ""}
  - {id: FP-CMD-028, name: "Launch arguments", desc: "Application launch flags open drawings and run scripts", p: P2, dep: [], status: planned, test: "", note: ""}
  - {id: FP-CMD-029, name: "Autocomplete configuration", desc: "Search delay, list length, system-variable suggestions, case match", p: P2, dep: [], status: planned, test: "", note: ""}
  - {id: FP-CMD-030, name: "Alias conflict policy", desc: "Defined precedence when imported and custom aliases collide", p: P2, dep: [], status: planned, test: "", note: ""}
  - {id: FP-CMD-031, name: "Command API invocation", desc: "Programmatic command execution with pause and resume for callers", p: P1, dep: [], status: planned, test: "", note: "bridge used by skills and agent"}
