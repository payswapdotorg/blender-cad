area: CMD
title: Command system
module: commands
entries:
  - {id: FP-CMD-001, name: "Command line entry", desc: "Typed, case-insensitive command names execute with Enter or Space", p: P0, dep: [], status: planned, test: "", note: ""}
  - {id: FP-CMD-002, name: "Autocomplete suggestions", desc: "Suggests commands and system variables while typing; accept with arrows", p: P0, dep: [], status: planned, test: "", note: ""}
  - {id: FP-CMD-003, name: "Command aliases", desc: "Short pgp-style aliases expand to full commands; user-editable", p: P0, dep: [], status: planned, test: "", note: ""}
  - {id: FP-CMD-004, name: "acad.pgp import", desc: "Import existing AutoCAD alias definitions into the registry", p: P1, dep: [], status: planned, test: "", note: ""}
  - {id: FP-CMD-005, name: "Transparent commands", desc: "Apostrophe-prefixed commands (ZOOM, PAN, OSNAP) run inside active commands", p: P0, dep: [], status: planned, test: "", note: ""}
  - {id: FP-CMD-006, name: "Prompt state machine", desc: "Sequenced prompts with bracketed options and angle-bracket defaults", p: P0, dep: [], status: planned, test: "", note: ""}
  - {id: FP-CMD-007, name: "Option cycling", desc: "Arrow keys cycle bracketed command options at the prompt", p: P1, dep: [], status: planned, test: "", note: ""}
  - {id: FP-CMD-008, name: "Default acceptance", desc: "Enter accepts the default value shown in angle brackets", p: P0, dep: [], status: planned, test: "", note: ""}
  - {id: FP-CMD-009, name: "Input history", desc: "Prompt input persists; Up and Down arrows recall previous entries", p: P0, dep: [], status: planned, test: "", note: ""}
