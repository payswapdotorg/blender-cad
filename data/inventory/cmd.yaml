  - {id: FP-CMD-013, name: UNDO, desc: "Grouped undo with Mark, Back, step counts and Control modes", p: P0, dep: [], status: planned, test: "", note: ""}
  - {id: FP-CMD-014, name: U, desc: "Undo a single operation", p: P0, dep: [], status: planned, test: "", note: ""}
  - {id: FP-CMD-015, name: REDO, desc: "Redo the most recently undone operations", p: P0, dep: [], status: planned, test: "", note: ""}
  - {id: FP-CMD-016, name: MREDO, desc: "Advanced redo modes: All, Last, Mark", p: P2, dep: [], status: planned, test: "", note: ""}
  - {id: FP-CMD-017, name: OOPS, desc: "Restore objects erased by the last ERASE after command end", p: P1, dep: [], status: planned, test: "", note: ""}
  - {id: FP-CMD-018, name: SCRIPT, desc: "Execute .scr script files as batched command input", p: P1, dep: [], status: planned, test: "", note: ""}
  - {id: FP-CMD-019, name: "Command search", desc: "Keyword search over commands and system variables with descriptions", p: P1, dep: [], status: planned, test: "", note: ""}
  - {id: FP-CMD-020, name: "Custom command registration", desc: "Modules register commands, prompts and options in one registry", p: P0, dep: [], status: planned, test: "", note: "registry hook consumed by toolsets and skills"}
  - {id: FP-CMD-021, name: "System variable access", desc: "Type variable names to set values; SETVAR lists all", p: P0, dep: [], status: planned, test: "", note: ""}
  - {id: FP-CMD-022, name: "Dynamic input toggle", desc: "Switch between command line and on-cursor prompting", p: P0, dep: [], status: planned, test: "", note: ""}
  - {id: FP-CMD-023, name: "Quick Properties toggle", desc: "Selection shows compact quick-properties popup near the cursor", p: P1, dep: [], status: planned, test: "", note: ""}
  - {id: FP-CMD-024, name: "Right-click modes", desc: "Configurable right-click: Enter/repeat or context shortcut menus", p: P0, dep: [], status: planned, test: "", note: ""}
  - {id: FP-CMD-025, name: "Noun-verb selection", desc: "PICKFIRST: preselected objects feed the next compatible command", p: P0, dep: [], status: planned, test: "", note: ""}
