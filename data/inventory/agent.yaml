  - {id: FP-AGT-012, name: "Browser access", desc: "Supervised browser tool available from inside the product", p: P2, dep: [zcode-runtime], status: planned, test: "", note: ""}
  - {id: FP-AGT-013, name: "Skill invocation", desc: "Run installed skills from the agent conversation panel", p: P1, dep: [], status: planned, test: "", note: ""}
